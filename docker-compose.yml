version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: tokped-mongo
    restart: always
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      # Amankan MongoDB: hanya listen di localhost VPS (tidak terbuka ke internet publik)
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tokped-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    container_name: tokped-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=tokopedia_db
      - JWT_SECRET=tokopedia_production_secret_key_vps_2026
      - FRONTEND_URL=*
      - GIN_MODE=release
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - tokped-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  tokped-net:
    driver: bridge