version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: tokped-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tokped-net

  # 1. API Gateway (Satu-satunya pintu publik ke internet di port 8080)
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: tokped-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://backend:8081
      - ORDER_SERVICE_URL=http://backend:8081
      - PRODUCT_SERVICE_URL=http://product-service:8082
    depends_on:
      - backend
      - product-service
    networks:
      - tokped-net

  # 2. Product & Review Microservice (Internal di port 8082)
  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    container_name: tokped-product-service
    restart: always
    environment:
      - PRODUCT_SERVICE_PORT=8082
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=tokopedia_db
      - JWT_SECRET=tokopedia_production_secret_key_vps_2026
      - FRONTEND_URL=*
    depends_on:
      - mongodb
    networks:
      - tokped-net

  # 3. Auth & Orders Backend (Internal di port 8081)
  backend:
    build:
      context: .
      args:
        SERVICE: api
    container_name: tokped-backend
    restart: always
    environment:
      - MONOLITH_PORT=8081
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=tokopedia_db
      - JWT_SECRET=tokopedia_production_secret_key_vps_2026
      - FRONTEND_URL=*
    depends_on:
      - mongodb
    networks:
      - tokped-net

volumes:
  mongo_data:
    driver: local

networks:
  tokped-net:
    driver: bridge